#  yaml-language-server: $schema=https://taskfile.dev/schema.json
# docs: https://taskfile.dev
---
version: "3"

includes:
  internal: internal.yml

tasks:
  # * Install CSpell
  install:cspell:
    desc: Install CSpell
    cmds:
      - task: internal:_install:npm
        vars:
          APP: cspell

  # * Install CodeSpell
  install:codespell:
    desc: Install CodeSpell
    cmds:
      - task: internal:_install:uv
        vars:
          APP: codespell

  # * Install Lychee
  install:lychee:
    desc: Install Lychee
    cmds:
      - task: internal:_install:winget
        vars:
          APP: "lycheeverse.lychee"
      - task: internal:_install:brew
        vars:
          APP: lychee
      - cmd: |
          arch=$(uname -m)
          download_url=$(curl --location --silent "https://api.github.com/repos/lycheeverse/lychee/releases/latest" | grep 'browser_download_url.*lychee-'"${arch}"'.*gnu.*tar.gz"' | grep -o 'https://[^"]*')
          temp_dir=$(mktemp -d)
          curl --location -o "${temp_dir}/lychee.tar.gz" "${download_url}"
          tar -xf "${temp_dir}/lychee.tar.gz" --directory "${temp_dir}"
          sudo install "${temp_dir}/$(basename "${download_url}" .tar.gz)/lychee" /usr/local/bin/lychee
          rm -rf "${temp_dir}"
        platforms: [linux]

  # * Tools
  tools:
    desc: Install Spell tools
    deps:
      - task: install:cspell
      - task: install:codespell
      - task: install:lychee

  # * Lint
  lint:
    desc: Lint Spell files
    cmds:
      - codespell --summary --write-changes
      - cspell --config ./.cspell.yml "./**/*.md"
      - lychee --config ./.lychee.toml --format markdown .
    dir: "{{.ROOT_DIR}}"
